services:
  - type: web
    name: opsiom-frontend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: OPSIOM_API_URL
        value: https://juloeco-opsiom.hf.space/api
      - key: OPSIOM_API_KEY
        sync: false   # à saisir manuellement dans le dashboard Render, jamais en dur ici
      - key: OPSIOM_TIMEOUT
        value: "90"
      - key: OCTIX_URL
        sync: false   # URL de l'API Octix (le compteur de quota y vit désormais)
      - key: OCTIX_PORTAL_URL
        sync: false   # portail Octix (lien "Créer un compte")
      - key: DAILY_TOKEN_QUOTA
        value: "2000"  # doit matcher la valeur configurée côté Octix
